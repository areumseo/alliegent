# Non-secret configuration. Safe to commit.
# Secrets live in .env locally and in `fly secrets` in production.
#
# The [agenda.props] / [projects.props] tables map this app's internal field
# names to the *actual property names in your Notion databases*. The agenda
# values below were verified against the real "Weekly Agenda DB" on 2026-08-09.
# Set an optional field to "" to disable the feature that uses it.

timezone = "Asia/Seoul"

[schedule]
# 24h local time in `timezone` above.
daily_brief = "08:00"          # morning briefing to Discord
incomplete_alert = "21:00"     # nudge about today's unfinished items

# Prompt to plan the coming week, with what is already in it.
weekly_planning_weekday = "sat"
weekly_planning_time = "10:00"

# Copies last week's Recurring rows onto the coming week. An empty time
# disables a job; this one is off because nothing repeats weekly yet. Tick
# Recurring on a few rows and set a time here to switch it on.
week_scaffold_weekday = "mon"
week_scaffold_time = ""
stale_project_weekday = "wed"
stale_project_time = "10:00"
weekly_review_weekday = "sun"
weekly_review_time = "21:00"

[agenda]
# Length of the week the scaffolding job fills in.
scaffold_days = 7

[agenda.props]
title = "Name"          # title property
date = "Date"           # date property
status = "Status"       # status OR select OR checkbox — auto-detected
recurring = "Recurring" # checkbox marking items that repeat weekly
category = "Category"   # select; copied onto scaffolded items
project = ""            # relation to a projects DB; none exists yet

[agenda.status_values]
# Used when `status` is a status/select property. Ignored for checkbox.
todo = "Not started"
doing = "In progress"
done = "Done"

[projects]
# A project with no agenda activity for this many days gets a nudge.
stale_after_days = 7

[projects.props]
title = "Name"
status = "Status"
next_action = "Next action"   # optional; "" to disable
last_activity = ""            # optional date prop; "" = derive from agenda rows

[projects.status_values]
active = "In progress"
done = "Done"
