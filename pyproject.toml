[project]
name = "alliegent"
version = "0.1.0"
description = "A personal AI agent for task management, project organization, and workflow automation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "discord.py>=2.4",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tzdata>=2024.1",
    "anthropic>=0.121.0",
    "icalendar>=7.2.2",
    "recurring-ical-events>=3.8.2",
    "caldav>=3.2.1",
]

[project.scripts]
alliegent = "alliegent.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alliegent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
