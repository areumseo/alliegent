# fly.toml app configuration file generated for alliegent on 2026-08-09T18:01:54+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'alliegent'
primary_region = 'nrt'

[build]
[env]
  PYTHONPATH = '/app/src'

[processes]
  app = 'alliegent'

# Deliberately no [http_service]. A Discord gateway connection is outbound and
# long-lived, so nothing ever arrives on an internal port. With an http_service
# and auto_stop_machines, Fly sees no traffic, stops the machine, and the bot
# goes offline while scheduled jobs silently stop firing. `fly launch`
# re-adds this block every time it runs — remove it again.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
