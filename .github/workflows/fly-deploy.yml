# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
# Manual only. This bot runs on the Mac mini, which pulls main itself, so
# deploying on push would put a second instance on Fly -- and two instances
# post every scheduled message twice. Run this from the Actions tab only if
# Fly is deliberately taking over again, and stop the mini first.
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
